model: Qwen/Qwen3.5-9B
train_type: lora
torch_dtype: bfloat16
num_train_epochs: 1
per_device_train_batch_size: 2
learning_rate: 1e-5
lora_rank: 16
lora_alpha: 32
target_modules: all-linear
gradient_accumulation_steps: 4
max_length: 4096
packing: true
eval_strategy: epoch
warmup_ratio: 0.05
freeze_vit: true
max_pixels: 1003520
output_dir: ./output
