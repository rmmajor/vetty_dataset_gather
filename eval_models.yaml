# Model specs evaluated by `cua/eval/screenspot/` / `make eval-screenspot`.
# Each spec is evaluated on the same dataset and the results are recorded side by side
# (eval_results/<label>.json + comparison.json).
#
# Fields: label (required), model (required), adapters (optional LoRA path),
#         backend (optional, overrides --backend), coord_space (optional, see below).
#
# coord_space is PER-MODEL, and it is not cosmetic: different checkpoints answer in
# different coordinate conventions, and scoring one in the other's space silently yields a
# wrong number instead of an error.
#   - a stock Qwen answers in `normalized_1000` (0-1000)
#   - an sft3 checkpoint (cua.prompt.coords.COORD_SPACE) also answers in `normalized_1000`
#   - an sft-v1/v2 checkpoint answers in `viewport_abs` (1280x720, the training viewport)
# Measured: the SAME base-model predictions score 85.0% as normalized_1000 and 25.0% as
# viewport_abs. Set coord_space explicitly on every spec — a before/after comparison is
# only meaningful if each side is scored in its own space.

- label: before
  model: Qwen/Qwen3.5-9B
  coord_space: normalized_1000

- label: after
  model: Qwen/Qwen3.5-9B
  adapters: ./output
  coord_space: normalized_1000
